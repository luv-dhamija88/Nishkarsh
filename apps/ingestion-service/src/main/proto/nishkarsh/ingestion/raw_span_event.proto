syntax = "proto3";

package nishkarsh.ingestion;

option java_package = "com.nishkarsh.ingestion_service.kafka.proto";
option java_outer_classname = "RawSpanEventProto";
option java_multiple_files = true;

// Compact event published to the raw-spans Kafka topic.
// Carries the core trace context needed for incident correlation.
// duration_ms is derived from span start/end times (nanoseconds → ms).
// status_code is the string representation: UNSET | OK | ERROR.
message RawSpanEvent {
  string event_id        = 1;
  string trace_id        = 2;
  string span_id         = 3;
  string parent_span_id  = 4;
  string service_name    = 5;
  string operation_name  = 6;
  int64  duration_ms     = 7;
  string status_code     = 8;
}

