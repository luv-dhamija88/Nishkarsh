syntax = "proto3";

package nishkarsh.ingestion;

option java_package = "com.nishkarsh.incident_processor.kafka.proto";
option java_outer_classname = "RawLogEventProto";
option java_multiple_files = true;

message RawLogEvent {
  string event_id = 1;
  string trace_id = 2;
  string span_id = 3;
  string service_name = 4;
  string severity = 5;
  string message = 6;
  string body = 7;
  string exception_type = 8;
  string exception_message = 9;
  string timestamp = 10;
  map<string, string> attributes = 11;
}

